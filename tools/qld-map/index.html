<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Queensland Map - Interactive map for Queensland's Proposed Boundaries">
    <meta name="apple-mobile-web-app-title" content="JaxLab - Qld Map">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
    
    <title>Qld Map - JaxLab</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- MapLibre GL JS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <!-- MapLibre GL Compare (Layer Swipe) -->
    <link rel="stylesheet" href="https://unpkg.com/@maplibre/maplibre-gl-compare@0.5.0/dist/maplibre-gl-compare.css">
    <script src="https://unpkg.com/@maplibre/maplibre-gl-compare@0.5.0/dist/maplibre-gl-compare.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <a href="/" class="logo">
                <div class="logo-icon">🧪</div>
                <span class="logo-text">Jax<span>Lab</span></span>
            </a>

            <h1 class="page-title">🗺️ Queensland Map</h1>

            <nav>
                <ul class="nav-links">
                    <li><a href="/">Home</a></li>
                    <li><a href="https://github.com/jwood74/jaxlab" target="_blank" rel="noopener noreferrer">GitHub</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Compare Map Container -->
    <div id="comparison-container" class="map-container">
        <div id="before" class="compare-map"></div>
        <div id="after" class="compare-map"></div>
    </div>

    <!-- Layer labels -->
    <div class="compare-label compare-label-before">2017 Boundaries</div>
    <div class="compare-label compare-label-after">2026 Boundaries</div>

    <!-- District hover overlay -->
    <div id="district-hover-overlay" class="district-hover-overlay" aria-live="polite">
        <span class="district-hover-prompt">Hover over a district</span>
        <div class="district-hover-info" hidden>
            <div class="district-hover-name" id="district-hover-name"></div>
            <div class="district-hover-detail" id="district-hover-detail"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../js/main.js"></script>
    <script src="app.js"></script>
</body>
</html>
